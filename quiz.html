<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML/CSS/JS Quiz</title>
  <style>
    :root {
      --bg: #07111f;
      --surface: rgba(255,255,255,0.1);
      --text: #f5f7ff;
      --muted: #aab7d0;
      --primary: #7c5cff;
      --secondary: #22d3ee;
      --accent: #ff6b6b;
      --success: #2dd4bf;
      --shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top left, rgba(124,92,255,0.28), transparent 30%),
                  radial-gradient(circle at bottom right, rgba(34,211,238,0.2), transparent 30%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      width: min(900px, 100%);
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .header { margin-bottom: 1.2rem; text-align: center; }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
    }

    h1 { font-size: clamp(1.8rem, 3vw, 2.4rem); margin-bottom: 0.5rem; }
    .subtitle { color: var(--muted); margin-bottom: 1rem; }

    .question-card {
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .question-card h3 { margin-bottom: 0.8rem; font-size: 1rem; }
    .options { display: grid; gap: 0.6rem; }
    .option {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      cursor: pointer;
    }
    .option input { accent-color: var(--primary); }

    .actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.8rem 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    button:hover { transform: translateY(-2px); }
    .submit-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
    .reset-btn { background: rgba(255,255,255,0.12); color: var(--text); }

    .result {
      margin-top: 1.2rem;
      padding: 1rem;
      border-radius: 16px;
      background: rgba(45,212,191,0.14);
      border: 1px solid rgba(45,212,191,0.28);
      text-align: center;
      display: none;
    }
    .result.show { display: block; }
    .result h2 { margin-bottom: 0.4rem; }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a class="back-link" href="index.html">← Back to Portfolio</a>
      <h1>HTML, CSS & JavaScript Quiz</h1>
      <p class="subtitle">Answer 20 quick questions and see your score instantly.</p>
    </div>

    <form id="quizForm">
      <div id="questions"></div>
      <div class="actions">
        <button type="submit" class="submit-btn">Submit Quiz</button>
        <button type="button" class="reset-btn" id="resetBtn">Reset</button>
      </div>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script>
    const questions = [
      { question: 'What does HTML stand for?', options: ['Hyper Text Markup Language', 'High Text Machine Language', 'Hyper Tool Makeup Language', 'Home Tool Markup Language'], answer: 0 },
      { question: 'Which tag is used to create a hyperlink?', options: ['<link>', '<a>', '<href>', '<url>'], answer: 1 },
      { question: 'Which CSS property changes text color?', options: ['background-color', 'font-size', 'color', 'margin'], answer: 2 },
      { question: 'Which property controls the space outside an element?', options: ['padding', 'margin', 'border', 'display'], answer: 1 },
      { question: 'What does CSS stand for?', options: ['Creative Style Sheets', 'Cascading Style Sheets', 'Computer Style Syntax', 'Colorful Style System'], answer: 1 },
      { question: 'Which HTML tag is used for the largest heading?', options: ['<h6>', '<h1>', '<head>', '<header>'], answer: 1 },
      { question: 'Which JavaScript keyword declares a variable?', options: ['var', 'loop', 'function', 'if'], answer: 0 },
      { question: 'What is the correct way to write an IF statement in JavaScript?', options: ['if i = 5', 'if (i == 5)', 'if {i == 5}', 'if i == 5 then'], answer: 1 },
      { question: 'Which symbol is used for comments in JavaScript?', options: ['<!-- -->', '//', '/* */', 'Both // and /* */'], answer: 3 },
      { question: 'Which method is used to print output in the browser console?', options: ['console.log()', 'print()', 'document.write()', 'alert()'], answer: 0 },
      { question: 'Which HTML attribute is used to define the image source?', options: ['src', 'href', 'alt', 'class'], answer: 0 },
      { question: 'What does the CSS flexbox property help with?', options: ['Create animations', 'Control layout', 'Store data', 'Handle files'], answer: 1 },
      { question: 'Which value makes an element take full width?', options: ['width: 100%', 'width: auto', 'width: fit-content', 'width: 0'], answer: 0 },
      { question: 'Which JavaScript function is used to create a popup box?', options: ['prompt()', 'confirm()', 'alert()', 'message()'], answer: 2 },
      { question: 'Which HTML tag is used to insert a line break?', options: ['<br>', '<lb>', '<break>', '<line>'], answer: 0 },
      { question: 'Which CSS property changes the size of text?', options: ['font-size', 'text-color', 'font-family', 'padding'], answer: 0 },
      { question: 'Which HTML tag is used to create an unordered list?', options: ['<ol>', '<list>', '<ul>', '<li>'], answer: 2 },
      { question: 'Which JavaScript operator compares both value and type?', options: ['===', '==', '!=', '='], answer: 0 },
      { question: 'Which HTML element is used to define a form?', options: ['<form>', '<input>', '<button>', '<section>'], answer: 0 },
      { question: 'Which CSS property makes text bold?', options: ['font-style', 'font-weight', 'text-align', 'line-height'], answer: 1 }
    ];

    const questionsContainer = document.getElementById('questions');
    const quizForm = document.getElementById('quizForm');
    const result = document.getElementById('result');
    const resetBtn = document.getElementById('resetBtn');

    function renderQuestions() {
      questionsContainer.innerHTML = questions.map((q, index) => `
        <div class="question-card">
          <h3>${index + 1}. ${q.question}</h3>
          <div class="options">
            ${q.options.map((option, optionIndex) => `
              <label class="option">
                <input type="radio" name="q${index}" value="${optionIndex}" />
                <span>${option}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function showResult(score) {
      const percentage = Math.round((score / questions.length) * 100);
      result.classList.add('show');
      result.innerHTML = `
        <h2>Quiz Complete!</h2>
        <p>You scored <strong>${score}</strong> out of <strong>${questions.length}</strong>.</p>
        <p>Your percentage is <strong>${percentage}%</strong>.</p>
      `;
      result.scrollIntoView({ behavior: 'smooth' });
    }

    quizForm.addEventListener('submit', (event) => {
      event.preventDefault();
      let score = 0;
      questions.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && Number(selected.value) === q.answer) {
          score += 1;
        }
      });
      showResult(score);
    });

    resetBtn.addEventListener('click', () => {
      quizForm.reset();
      result.classList.remove('show');
      result.innerHTML = '';
    });

    renderQuestions();
  </script>
</body>
</html>
